name: Feature request
description: Suggest an improvement that preserves RIFT's local-first scope.
title: "[feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed change
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security impact
      description: Explain effects on existing clients, data integrity, and authorized use.
    validations:
      required: true
