<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">RIFT — social preview</title>
  <desc id="desc">Social preview card for RIFT: crimson angular R mark, RIFT wordmark, product taglines, and Egypt provenance line on a charcoal grid background.</desc>

  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#17181f" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#090a0d"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <g fill="none" stroke="#d7193f" stroke-opacity="0.22" stroke-width="34" stroke-linecap="square" stroke-linejoin="miter" transform="translate(920,208) scale(1.9)">
    <path d="M22 18 H80 L108 46 L80 74 H22 Z"/>
    <path d="M22 74 V112"/>
    <path d="M56 74 L116 112"/>
  </g>

  <text x="96" y="118" fill="#f04a68" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="5.4">MCP-POWERED OFFENSIVE SECURITY INTELLIGENCE ENGINE</text>

  <g fill="none" stroke="#d7193f" stroke-width="17" stroke-linecap="square" stroke-linejoin="miter" transform="translate(96,158)">
    <path d="M22 18 H80 L108 46 L80 74 H22 Z"/>
    <path d="M22 74 V112"/>
    <path d="M56 74 L116 112"/>
  </g>

  <text x="96" y="404" fill="#f2f3f5" font-family="Inter, Arial, Helvetica, sans-serif" font-size="150" font-weight="800" letter-spacing="34">RIFT</text>
  <text x="98" y="472" fill="#c7c9cf" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" letter-spacing="6.2">LOCAL OFFENSIVE SECURITY KNOWLEDGE ENGINE</text>

  <path d="M96 538 H1184" stroke="#2b2c35" stroke-width="2"/>
  <text x="96" y="592" fill="#9ca0aa" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="2.4">MADE IN EGYPT · AHMED SABRY (SABRIIGSXR) · CYBER SECURITY RESEARCHER</text>
  <text x="1184" y="592" fill="#f04a68" text-anchor="end" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2.4">AUTHORIZED USE ONLY</text>
</svg>
