<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">RIFT local offensive security knowledge engine</title>
  <desc id="desc">A dark technical grid with a bright RIFT signal crossing a local knowledge index and returning grounded results to an MCP client.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1b2228" stroke-width="1"/></pattern>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#8cff66"/><stop offset="1" stop-color="#62dcff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="720" fill="#090a0d"/><rect width="1600" height="720" fill="url(#grid)"/>
  <circle cx="1170" cy="320" r="220" fill="#8cff66" opacity=".10" filter="url(#blur)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="112" y="188" fill="#8cff66" font-size="24" font-weight="700" letter-spacing="5">LOCAL OFFENSIVE SECURITY KNOWLEDGE ENGINE</text>
    <text x="108" y="286" fill="#f2f3f5" font-size="92" font-weight="800" letter-spacing="10">RIFT</text>
    <text x="114" y="340" fill="#9ca0aa" font-size="27">MCP-powered retrieval for authorized security work.</text>
    <text x="114" y="392" fill="#9ca0aa" font-size="20">Ask a question → search local knowledge → inspect the sources.</text>
    <rect x="114" y="454" width="364" height="62" rx="8" fill="#14151c" stroke="#8cff66"/>
    <text x="140" y="494" fill="#8cff66" font-size="19" font-family="monospace">$ rift --transport stdio</text>
    <g transform="translate(900 160)">
      <rect width="520" height="380" rx="18" fill="#14151c" stroke="#2b3440" stroke-width="2"/>
      <circle cx="30" cy="30" r="6" fill="#8cff66"/><circle cx="52" cy="30" r="6" fill="#62dcff"/><circle cx="74" cy="30" r="6" fill="#6e727c"/>
      <text x="32" y="92" fill="#9ca0aa" font-size="18" font-family="monospace">MCP CLIENT</text>
      <path d="M80 132H438M80 192H438M80 252H438" stroke="#2b3440" stroke-width="2"/>
      <text x="80" y="150" fill="#f2f3f5" font-size="20" font-family="monospace">search_offensive_scenarios</text>
      <text x="80" y="210" fill="#8cff66" font-size="20" font-family="monospace">→ 23,737 indexed entries</text>
      <text x="80" y="270" fill="#62dcff" font-size="20" font-family="monospace">→ citable doc_ids + scores</text>
      <rect x="80" y="304" width="358" height="42" rx="6" fill="#0d1114" stroke="#8cff66"/>
      <text x="98" y="331" fill="#8cff66" font-size="16" font-family="monospace">local / inspectable / extractive</text>
    </g>
  </g>
</svg>
