<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">RIFT architecture overview</title><desc id="desc">An MCP client connects over stdio or localhost HTTP to the RIFT server, which uses a local model and FAISS files.</desc>
  <defs><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#1b2228"/></pattern></defs><rect width="1500" height="760" fill="#090a0d"/><rect width="1500" height="760" fill="url(#grid)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="70" y="76" fill="#f2f3f5" font-size="42" font-weight="800">RIFT is a local retrieval boundary</text><text x="72" y="116" fill="#9ca0aa" font-size="20">The client asks. The server retrieves. The local index stays inspectable.</text>
    <rect x="70" y="220" width="260" height="260" rx="18" fill="#14151c" stroke="#62dcff" stroke-width="2"/><text x="104" y="270" fill="#62dcff" font-size="19" font-weight="700">MCP CLIENT</text><text x="104" y="330" fill="#f2f3f5" font-size="22">OpenCode</text><text x="104" y="370" fill="#f2f3f5" font-size="22">Claude Desktop</text><text x="104" y="410" fill="#9ca0aa" font-size="17">or another host</text>
    <path d="M330 300H470M330 400H470" stroke="#8cff66" stroke-width="4"/><text x="352" y="282" fill="#8cff66" font-size="16">stdio</text><text x="352" y="382" fill="#8cff66" font-size="16">localhost HTTP</text><path d="m458 287 18 13-18 13M458 387l18 13-18 13" fill="none" stroke="#8cff66" stroke-width="4"/>
    <rect x="500" y="180" width="440" height="340" rx="18" fill="#14151c" stroke="#8cff66" stroke-width="2"/><text x="538" y="230" fill="#8cff66" font-size="19" font-weight="700">RIFT MCP SERVER</text><text x="538" y="292" fill="#f2f3f5" font-size="21">search · ask · stats</text><text x="538" y="340" fill="#9ca0aa" font-size="18">Lazy engine singleton</text><text x="538" y="380" fill="#9ca0aa" font-size="18">Input validation</text><text x="538" y="420" fill="#9ca0aa" font-size="18">Extractive results</text><rect x="538" y="452" width="324" height="34" rx="6" fill="#0d1114" stroke="#2b3440"/><text x="554" y="475" fill="#62dcff" font-size="14" font-family="monospace">no shell tools · no generation</text>
    <path d="M940 350H1040" stroke="#8cff66" stroke-width="4"/><path d="m1028 337 18 13-18 13" fill="none" stroke="#8cff66" stroke-width="4"/>
    <rect x="1070" y="180" width="360" height="340" rx="18" fill="#14151c" stroke="#2b3440" stroke-width="2"/><text x="1108" y="230" fill="#62dcff" font-size="19" font-weight="700">LOCAL KNOWLEDGE</text><text x="1108" y="292" fill="#f2f3f5" font-size="20">Sentence Transformer</text><text x="1108" y="340" fill="#f2f3f5" font-size="20">FAISS IndexFlatIP</text><text x="1108" y="388" fill="#f2f3f5" font-size="20">metadata.jsonl</text><text x="1108" y="436" fill="#f2f3f5" font-size="20">documents.jsonl</text><text x="1108" y="480" fill="#9ca0aa" font-size="16">read-only at query time</text>
    <rect x="500" y="600" width="930" height="60" rx="10" fill="#1c1e27" stroke="#8cff66"/><text x="530" y="638" fill="#8cff66" font-size="19">BOUNDARY</text><text x="660" y="638" fill="#f2f3f5" font-size="18">No network required after the local model is cached.</text>
  </g>
</svg>
