<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc"><title id="title">RIFT MCP workflow</title><desc id="desc">An MCP client sends a tool call over stdio or streamable HTTP to RIFT and receives structured JSON or extractive text.</desc><rect width="1400" height="600" fill="#090a0d"/><g font-family="Inter,Arial,sans-serif"><text x="80" y="82" fill="#f2f3f5" font-size="42" font-weight="800">MCP makes RIFT callable</text><text x="82" y="122" fill="#9ca0aa" font-size="20">MCP is the interface; retrieval remains local.</text><rect x="80" y="210" width="280" height="240" rx="16" fill="#14151c" stroke="#62dcff"/><text x="116" y="268" fill="#62dcff" font-size="18" font-weight="700">MCP HOST / CLIENT</text><text x="116" y="326" fill="#f2f3f5" font-size="21">Ask a question</text><text x="116" y="366" fill="#9ca0aa" font-size="17">Lists tools + prompt</text><text x="116" y="406" fill="#9ca0aa" font-size="17">Sends one request</text><path d="M390 280H600M390 380H600" stroke="#8cff66" stroke-width="4"/><text x="430" y="262" fill="#8cff66" font-size="17">stdio (default)</text><text x="430" y="362" fill="#8cff66" font-size="17">streamable HTTP</text><path d="m588 267 18 13-18 13M588 367l18 13-18 13" fill="none" stroke="#8cff66" stroke-width="4"/><rect x="630" y="180" width="320" height="300" rx="16" fill="#14151c" stroke="#8cff66"/><text x="670" y="238" fill="#8cff66" font-size="18" font-weight="700">RIFT SERVER</text><text x="670" y="292" fill="#f2f3f5" font-size="20">search_offensive_scenarios</text><text x="670" y="332" fill="#f2f3f5" font-size="20">ask_offensive_scenario</text><text x="670" y="372" fill="#f2f3f5" font-size="20">index_stats</text><text x="670" y="428" fill="#9ca0aa" font-size="16">No shell tools. No generation.</text><path d="M980 330H1080" stroke="#8cff66" stroke-width="4"/><path d="m1068 317 18 13-18 13" fill="none" stroke="#8cff66" stroke-width="4"/><rect x="1110" y="210" width="220" height="240" rx="16" fill="#14151c" stroke="#62dcff"/><text x="1146" y="268" fill="#62dcff" font-size="18" font-weight="700">RESPONSE</text><text x="1146" y="326" fill="#f2f3f5" font-size="20">JSON</text><text x="1146" y="366" fill="#f2f3f5" font-size="20">or text</text><text x="1146" y="406" fill="#9ca0aa" font-size="16">doc_ids + scores</text><rect x="80" y="520" width="1250" height="34" rx="7" fill="#1c1e27"/><text x="106" y="543" fill="#8cff66" font-size="15">Security note:</text><text x="220" y="543" fill="#9ca0aa" font-size="15">HTTP has no built-in authentication; keep it on localhost or behind a protected boundary.</text></g></svg>
