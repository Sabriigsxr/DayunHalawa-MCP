<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">RIFT product overview</title><desc id="desc">Three connected panels show ask, retrieve, and inspect with RIFT.</desc>
  <defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1b2228"/></pattern></defs>
  <rect width="1400" height="620" fill="#090a0d"/><rect width="1400" height="620" fill="url(#g)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="80" y="88" fill="#f2f3f5" font-size="44" font-weight="800">One question. Three useful views.</text><text x="82" y="126" fill="#9ca0aa" font-size="20">RIFT keeps retrieval local and makes every result inspectable.</text>
    <g transform="translate(80 190)"><rect width="360" height="290" rx="16" fill="#14151c" stroke="#2b3440"/><text x="32" y="58" fill="#8cff66" font-size="18" font-weight="700">01 · ASK</text><text x="32" y="112" fill="#f2f3f5" font-size="22">“How do I detect</text><text x="32" y="142" fill="#f2f3f5" font-size="22">Kerberoasting?”</text><path d="M32 188H318" stroke="#2b3440"/><text x="32" y="230" fill="#9ca0aa" font-size="17">Natural language input</text><text x="32" y="258" fill="#62dcff" font-size="17">MCP tool call</text></g>
    <path d="M470 335H550" stroke="#8cff66" stroke-width="4"/><path d="m540 322 18 13-18 13" fill="none" stroke="#8cff66" stroke-width="4"/>
    <g transform="translate(570 190)"><rect width="360" height="290" rx="16" fill="#14151c" stroke="#2b3440"/><text x="32" y="58" fill="#8cff66" font-size="18" font-weight="700">02 · RETRIEVE</text><circle cx="102" cy="142" r="54" fill="none" stroke="#62dcff" stroke-width="4"/><circle cx="102" cy="142" r="9" fill="#8cff66"/><path d="M102 142 154 112M102 142 70 186M102 142 135 184" stroke="#62dcff" stroke-width="3"/><text x="32" y="230" fill="#9ca0aa" font-size="17">Embedding + FAISS</text><text x="32" y="258" fill="#62dcff" font-size="17">Local similarity search</text></g>
    <path d="M960 335H1040" stroke="#8cff66" stroke-width="4"/><path d="m1030 322 18 13-18 13" fill="none" stroke="#8cff66" stroke-width="4"/>
    <g transform="translate(1060 190)"><rect width="260" height="290" rx="16" fill="#14151c" stroke="#2b3440"/><text x="28" y="58" fill="#8cff66" font-size="18" font-weight="700">03 · INSPECT</text><text x="28" y="112" fill="#f2f3f5" font-size="19">Top results</text><text x="28" y="150" fill="#9ca0aa" font-size="17">doc_id · score</text><text x="28" y="182" fill="#9ca0aa" font-size="17">tags · source Q&amp;A</text><rect x="28" y="220" width="204" height="38" rx="6" fill="#0d1114" stroke="#8cff66"/><text x="42" y="245" fill="#8cff66" font-size="14" font-family="monospace">grounded output</text></g>
  </g>
</svg>
