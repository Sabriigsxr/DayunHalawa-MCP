<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc"><title id="title">RIFT data flow</title><desc id="desc">A left-to-right data flow from a question to normalized embeddings, FAISS, aligned records, and a grounded response.</desc><rect width="1500" height="500" fill="#090a0d"/><g font-family="Inter,Arial,sans-serif"><text x="70" y="74" fill="#f2f3f5" font-size="38" font-weight="800">Question → evidence</text><text x="72" y="112" fill="#9ca0aa" font-size="19">A small pipeline with explicit checkpoints.</text><g transform="translate(70 190)"><rect width="210" height="170" rx="14" fill="#14151c" stroke="#62dcff"/><text x="28" y="58" fill="#62dcff" font-size="17" font-weight="700">INPUT</text><text x="28" y="104" fill="#f2f3f5" font-size="19">Question</text><text x="28" y="137" fill="#9ca0aa" font-size="15">“detect PtH”</text></g><path d="M300 275H360" stroke="#8cff66" stroke-width="4"/><path d="m350 262 18 13-18 13" fill="none" stroke="#8cff66" stroke-width="4"/><g transform="translate(380 190)"><rect width="210" height="170" rx="14" fill="#14151c" stroke="#8cff66"/><text x="28" y="58" fill="#8cff66" font-size="17" font-weight="700">ENCODE</text><text x="28" y="104" fill="#f2f3f5" font-size="19">384 dims</text><text x="28" y="137" fill="#9ca0aa" font-size="15">normalized vector</text></g><path d="M610 275H670" stroke="#8cff66" stroke-width="4"/><path d="m660 262 18 13-18 13" fill="none" stroke="#8cff66" stroke-width="4"/><g transform="translate(690 190)"><rect width="210" height="170" rx="14" fill="#14151c" stroke="#8cff66"/><text x="28" y="58" fill="#8cff66" font-size="17" font-weight="700">SEARCH</text><text x="28" y="104" fill="#f2f3f5" font-size="19">FAISS</text><text x="28" y="137" fill="#9ca0aa" font-size="15">inner-product scan</text></g><path d="M920 275H980" stroke="#8cff66" stroke-width="4"/><path d="m970 262 18 13-18 13" fill="none" stroke="#8cff66" stroke-width="4"/><g transform="translate(1000 190)"><rect width="210" height="170" rx="14" fill="#14151c" stroke="#62dcff"/><text x="28" y="58" fill="#62dcff" font-size="17" font-weight="700">ALIGN</text><text x="28" y="104" fill="#f2f3f5" font-size="19">doc_id</text><text x="28" y="137" fill="#9ca0aa" font-size="15">metadata + Q&amp;A</text></g><path d="M1230 275H1290" stroke="#8cff66" stroke-width="4"/><path d="m1280 262 18 13-18 13" fill="none" stroke="#8cff66" stroke-width="4"/><g transform="translate(1310 190)"><rect width="120" height="170" rx="14" fill="#14151c" stroke="#8cff66"/><text x="22" y="58" fill="#8cff66" font-size="17" font-weight="700">OUT</text><text x="22" y="104" fill="#f2f3f5" font-size="18">sources</text><text x="22" y="137" fill="#9ca0aa" font-size="14">scores</text></g></g></svg>
