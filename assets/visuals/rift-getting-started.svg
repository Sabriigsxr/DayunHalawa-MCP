<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc"><title id="title">RIFT getting started</title><desc id="desc">Three numbered cards show install, restore, and connect.</desc><rect width="1400" height="560" fill="#090a0d"/><g font-family="Inter,Arial,sans-serif"><text x="80" y="84" fill="#f2f3f5" font-size="42" font-weight="800">Your first RIFT session</text><text x="82" y="124" fill="#9ca0aa" font-size="20">Three local steps from clone to grounded search.</text><g transform="translate(80 200)"><rect width="360" height="240" rx="16" fill="#14151c" stroke="#2b3440"/><text x="34" y="66" fill="#8cff66" font-size="34" font-weight="800">01</text><text x="34" y="120" fill="#f2f3f5" font-size="23">Install</text><text x="34" y="164" fill="#9ca0aa" font-size="17">Create a virtualenv and</text><text x="34" y="190" fill="#9ca0aa" font-size="17">install the package.</text></g><path d="M470 320H550" stroke="#8cff66" stroke-width="4"/><path d="m540 307 18 13-18 13" fill="none" stroke="#8cff66" stroke-width="4"/><g transform="translate(590 200)"><rect width="360" height="240" rx="16" fill="#14151c" stroke="#2b3440"/><text x="34" y="66" fill="#8cff66" font-size="34" font-weight="800">02</text><text x="34" y="120" fill="#f2f3f5" font-size="23">Restore</text><text x="34" y="164" fill="#9ca0aa" font-size="17">Verify the checksum and</text><text x="34" y="190" fill="#9ca0aa" font-size="17">restore the local index.</text></g><path d="M980 320H1060" stroke="#8cff66" stroke-width="4"/><path d="m1050 307 18 13-18 13" fill="none" stroke="#8cff66" stroke-width="4"/><g transform="translate(1100 200)"><rect width="240" height="240" rx="16" fill="#14151c" stroke="#8cff66"/><text x="34" y="66" fill="#8cff66" font-size="34" font-weight="800">03</text><text x="34" y="120" fill="#f2f3f5" font-size="23">Connect</text><text x="34" y="164" fill="#9ca0aa" font-size="17">Add the MCP server</text><text x="34" y="190" fill="#9ca0aa" font-size="17">to your client.</text></g></g></svg>
