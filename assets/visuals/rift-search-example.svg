<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc"><title id="title">RIFT semantic search example</title><desc id="desc">A terminal-inspired panel shows an illustrative query and clearly labeled retrieved source fields.</desc><rect width="1400" height="680" fill="#090a0d"/><g font-family="Inter,Arial,sans-serif"><text x="80" y="82" fill="#f2f3f5" font-size="42" font-weight="800">A result you can inspect</text><text x="82" y="122" fill="#9ca0aa" font-size="20">Illustrative layout; see the verified demo for actual values.</text><rect x="80" y="180" width="1240" height="410" rx="16" fill="#14151c" stroke="#2b3440"/><circle cx="116" cy="220" r="7" fill="#8cff66"/><circle cx="140" cy="220" r="7" fill="#62dcff"/><circle cx="164" cy="220" r="7" fill="#6e727c"/><text x="104" y="278" fill="#8cff66" font-size="18" font-family="monospace">$ search_offensive_scenarios</text><text x="104" y="320" fill="#f2f3f5" font-size="19" font-family="monospace">query: “kerberoasting detection”</text><path d="M104 350H1270" stroke="#2b3440"/><text x="104" y="394" fill="#62dcff" font-size="18" font-family="monospace">RESULT 01</text><text x="104" y="432" fill="#f2f3f5" font-size="18" font-family="monospace">doc_id: cybersec-…</text><text x="104" y="466" fill="#f2f3f5" font-size="18" font-family="monospace">score: 0.7102</text><text x="104" y="500" fill="#9ca0aa" font-size="17" font-family="monospace">question: detection guidance from stored Q&amp;A</text><rect x="900" y="390" width="330" height="86" rx="8" fill="#0d1114" stroke="#8cff66"/><text x="928" y="426" fill="#8cff66" font-size="16">GROUNDING CHECK</text><text x="928" y="455" fill="#9ca0aa" font-size="15">source id + score + text</text><text x="104" y="548" fill="#8cff66" font-size="16" font-family="monospace">No generated plan. No hidden action.</text></g></svg>
