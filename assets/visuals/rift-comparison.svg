<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">RIFT comparison graphic</title><desc id="desc">A comparison of keyword search and semantic retrieval using conceptual examples, not benchmark scores.</desc><rect width="1400" height="620" fill="#090a0d"/><g font-family="Inter,Arial,sans-serif"><text x="80" y="82" fill="#f2f3f5" font-size="42" font-weight="800">Keyword match vs. meaning match</text><text x="82" y="122" fill="#9ca0aa" font-size="20">Conceptual illustration — not a benchmark.</text><rect x="80" y="180" width="570" height="330" rx="16" fill="#14151c" stroke="#2b3440"/><text x="120" y="236" fill="#9ca0aa" font-size="20" font-weight="700">TRADITIONAL KEYWORD SEARCH</text><text x="120" y="292" fill="#f2f3f5" font-size="20">Query: “detect pass-the-hash”</text><rect x="120" y="330" width="180" height="54" rx="8" fill="#1c1e27"/><text x="142" y="364" fill="#f2f3f5" font-size="17">exact phrase</text><path d="M340 357H510" stroke="#6e727c" stroke-width="3" stroke-dasharray="8 8"/><text x="120" y="440" fill="#9ca0aa" font-size="17">May miss: “NTLM hash reuse”</text><rect x="750" y="180" width="570" height="330" rx="16" fill="#14151c" stroke="#8cff66"/><text x="790" y="236" fill="#8cff66" font-size="20" font-weight="700">SEMANTIC RETRIEVAL</text><text x="790" y="292" fill="#f2f3f5" font-size="20">Query becomes a vector</text><circle cx="950" cy="382" r="76" fill="none" stroke="#62dcff" stroke-width="3"/><circle cx="912" cy="350" r="9" fill="#8cff66"/><circle cx="1000" cy="405" r="9" fill="#8cff66"/><circle cx="970" cy="330" r="9" fill="#62dcff"/><text x="790" y="470" fill="#9ca0aa" font-size="17">Finds related concepts by similarity</text></g></svg>
