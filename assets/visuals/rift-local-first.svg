<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">RIFT local-first boundary</title><desc id="desc">A local machine boundary contains the model, FAISS index, and RIFT server; only an optional client boundary crosses outward.</desc><rect width="1400" height="620" fill="#090a0d"/><g font-family="Inter,Arial,sans-serif"><text x="80" y="82" fill="#f2f3f5" font-size="42" font-weight="800">Local-first by construction</text><text x="82" y="122" fill="#9ca0aa" font-size="20">After the model is cached, query-time retrieval stays inside the host.</text><rect x="330" y="175" width="770" height="330" rx="24" fill="#0d1114" stroke="#8cff66" stroke-width="3" stroke-dasharray="10 8"/><text x="370" y="220" fill="#8cff66" font-size="18" font-weight="700">YOUR MACHINE · LOCAL BOUNDARY</text><rect x="390" y="270" width="200" height="150" rx="12" fill="#14151c" stroke="#2b3440"/><text x="420" y="320" fill="#62dcff" font-size="17" font-weight="700">MODEL</text><text x="420" y="360" fill="#f2f3f5" font-size="18">384-dim</text><text x="420" y="390" fill="#9ca0aa" font-size="15">embedding cache</text><rect x="650" y="270" width="200" height="150" rx="12" fill="#14151c" stroke="#2b3440"/><text x="680" y="320" fill="#62dcff" font-size="17" font-weight="700">INDEX</text><text x="680" y="360" fill="#f2f3f5" font-size="18">FAISS</text><text x="680" y="390" fill="#9ca0aa" font-size="15">aligned records</text><rect x="910" y="270" width="150" height="150" rx="12" fill="#14151c" stroke="#8cff66"/><text x="934" y="320" fill="#8cff66" font-size="17" font-weight="700">RIFT</text><text x="934" y="360" fill="#f2f3f5" font-size="18">MCP</text><text x="934" y="390" fill="#9ca0aa" font-size="15">server</text><path d="M590 345H640M850 345H900" stroke="#8cff66" stroke-width="4"/><path d="m630 332 18 13-18 13M890 332l18 13-18 13" fill="none" stroke="#8cff66" stroke-width="4"/><rect x="70" y="260" width="170" height="160" rx="12" fill="#14151c" stroke="#62dcff"/><text x="102" y="312" fill="#62dcff" font-size="17" font-weight="700">CLIENT</text><text x="102" y="350" fill="#f2f3f5" font-size="18">MCP host</text><text x="102" y="382" fill="#9ca0aa" font-size="14">optional boundary</text><path d="M240 340H310" stroke="#62dcff" stroke-width="4" stroke-dasharray="8 8"/><text x="1150" y="292" fill="#9ca0aa" font-size="17">No cloud API</text><text x="1150" y="324" fill="#9ca0aa" font-size="17">No telemetry</text><text x="1150" y="356" fill="#9ca0aa" font-size="17">No query network</text><text x="1150" y="388" fill="#9ca0aa" font-size="17">dependency</text></g></svg>
