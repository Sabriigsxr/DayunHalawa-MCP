[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dayunhalawa-mcp"
version = "1.0.0"
description = "Offensive Scenario RAG MCP server — local pentesting/DFIR Q&A knowledge base exposed over MCP (stdio or HTTP) for agentic coding apps."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ahmed Sabry" }]
keywords = ["mcp", "model-context-protocol", "pentesting", "rag", "offensive-security", "dfir"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.2.0",
    "sentence-transformers>=2.5.0",
    "faiss-cpu>=1.7.4",
    "numpy",
]

[project.scripts]
dayunhalawa-mcp = "dayunhalawa_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["dayunhalawa_mcp*"]
