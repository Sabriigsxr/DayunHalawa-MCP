[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rift-mcp"
version = "2.0.0"
description = "MCP-powered offensive security intelligence engine using local semantic retrieval, FAISS, and RAG."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ahmed Sabry" }]
keywords = ["mcp", "model-context-protocol", "pentesting", "rag", "offensive-security", "red-team", "faiss", "egypt", "security-research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.2.0",
    "sentence-transformers>=2.5.0",
    "faiss-cpu>=1.7.4",
    "numpy",
]

[project.scripts]
dayunhalawa-mcp = "dayunhalawa_mcp.__main__:main"
rift = "dayunhalawa_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["dayunhalawa_mcp*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Sabriigsxr/RIFT"
Repository = "https://github.com/Sabriigsxr/RIFT"
Issues = "https://github.com/Sabriigsxr/RIFT/issues"
